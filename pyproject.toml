[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fabric-event-dispatcher"
version = "0.1.0"
description = "Event-driven, self-chaining dispatcher for Microsoft Fabric apps that lets the backing SQL database sleep."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["requests>=2.31"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]

[tool.ruff]
line-length = 110
